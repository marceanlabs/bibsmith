name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 1 * *" # fresh lockfile on the 1st, so an upstream break is a red build

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check
      - name: clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets -- -D warnings
      - name: tests
        run: cargo test --release

  oracle:
    # The oracle fixtures are committed, so this only needs to prove they still
    # agree with a real biber rather than regenerate them on every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install biber
        run: |
          sudo apt-get update
          sudo apt-get install -y biber texlive-latex-base texlive-bibtex-extra
      - name: regenerate the expected order with real biber
        run: |
          ./scripts/make_oracle.sh
          git diff --exit-code oracle/order-*.txt
      - name: tests against the freshly generated oracle
        run: cargo test --release --test oracle
