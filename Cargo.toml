[package]
name = "bibsmith"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "Sort and normalise .bib files the way biblatex does, without Perl or TeX"
license = "Apache-2.0"
repository = "https://github.com/marceanlabs/bibsmith"
keywords = ["bibtex", "biblatex", "biber", "citation", "cli"]
categories = ["command-line-utilities", "parsing"]
exclude = ["spikes/*", "oracle/*.pdf", "oracle/*.aux", "oracle/*.log", "oracle/*.bbl", "oracle/*.bcf", "oracle/*.blg", "oracle/*.run.xml"]

[lib]
name = "bibsmith"
path = "src/lib.rs"

[[bin]]
name = "bibsmith"
path = "src/main.rs"

[dependencies]
biblatex = "0.12.0"
clap = { version = "4.6.7", features = ["derive"] }
icu_collator = { version = "2.1.2", features = ["compiled_data"] }
icu_locale = "2.1.1"
md5 = "0.8.1"
quick-xml = { version = "0.41.0", default-features = false, features = ["serialize"] }

[profile.release]
lto = true
codegen-units = 1

